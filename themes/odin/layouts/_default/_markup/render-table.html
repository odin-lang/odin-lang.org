{{- /* Tables as pkg.odin-lang.org's, which scroll sideways rather than widen the page. Their class
       keeps js/script.js from making them Bootstrap tables */ -}}
<div class="doc-table-scroll"><table class="doc-table"
  {{- range $k, $v := .Attributes }}{{ if $v }}{{ printf " %s=%q" $k $v | safeHTMLAttr }}{{ end }}{{ end }}>
<thead>
{{- range .THead }}
<tr>
  {{- range . }}
  <th{{ with .Alignment }} style="text-align: {{ . }}"{{ end }}>{{ .Text }}</th>
  {{- end }}
</tr>
{{- end }}
</thead>
<tbody>
{{- range .TBody }}
<tr>
  {{- range . }}
  <td{{ with .Alignment }} style="text-align: {{ . }}"{{ end }}>{{ .Text }}</td>
  {{- end }}
</tr>
{{- end }}
</tbody>
</table></div>
