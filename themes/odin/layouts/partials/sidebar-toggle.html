{{- /* The collapse button of a sidebar, the same as `write_sidebar_toggle` on pkg.odin-lang.org */ -}}
<button type="button" class="odin-sidebar-toggle" data-sidebar="{{ .name }}" onclick="toggleSidebar(this)" aria-expanded="true" title="Toggle {{ .label }}"><svg viewBox="0 0 16 16" aria-hidden="true"><path d="M10 3 5 8l5 5"/></svg><span>{{ .label }}</span></button>
